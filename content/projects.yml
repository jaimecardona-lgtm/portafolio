projects:
  - id: agropilot-cm
    name: Agropilot CM
    tagline: Ecosistema inteligente para modernizar la gestión agropecuaria colombiana
    full_name: Agropilot CM (formerly Agrosoft CM)
    type: Own Project / Business
    status: Production
    featured: true
    priority: 1

    overview: |
      Plataforma integral que conecta producción agrícola real con datos,
      inteligencia artificial y automatización. Modernización del agro colombiano
      mediante tecnología, predicción y decisiones basadas en información.

    problem: |
      Las fincas colombianas operan con información fragmentada:
      - Cuadernos físicos vs. datos digitales
      - Decisiones manuales sin análisis histórico
      - Costos no medidos claramente
      - Falta de predictibilidad
      - Incapacidad de escalar operaciones
      - Pérdida de oportunidades de optimización

    solution: |
      Ecosistema digital que captura datos operacionales, los analiza con
      modelos de ML, genera predicciones y expone un asistente conversacional
      inteligente para tomar decisiones mejores.

    modules:
      production:
        - Producción lechera
        - Ganadería de carne
        - Porcicultura
        - Sistemas silvopastorales
        - Apiariismo
        - Cultivos asociados

      management:
        - Gestión del hato
        - Inventario de animales
        - Trazabilidad por individuo
        - Histórico completo
        - Transferencia entre fincas

      analytics:
        - Producción individual y masiva
        - Predicción de rendimiento
        - Análisis de costos
        - Rentabilidad por línea
        - Alertas de anomalías
        - Dashboard ejecutivo

      intelligence:
        - Asistente conversacional
        - RAG con conocimiento agrícola
        - Router de modelos
        - Recomendaciones
        - Análisis de decisiones
        - Predicciones en tiempo real

      operations:
        - Registro de trabajadores
        - Veterinarios y servicios
        - Artículos y comentarios
        - Comunicación interna
        - Suscripciones y pagos

    technical_architecture:
      frontend:
        - React 18 + TypeScript
        - Redux Toolkit para estado
        - Tailwind CSS + Lucide icons
        - Recharts para visualización
        - Responsive (mobile, tablet, desktop)
        - Real-time updates

      backend:
        - Node.js + Express (APIs)
        - FastAPI + Python (IA, análisis)
        - Servicios desacoplados

      data_layer:
        - Supabase + PostgreSQL
        - Row Level Security (RLS)
        - JWT autenticación
        - Realtime subscriptions
        - Multi-tenant architecture (por farm_id)
        - pgvector para embeddings

      models_and_ai:
        - Regresión Lineal
        - Árboles de Decisión
        - LSTM (series temporales)
        - Random Forest
        - AdaBoost
        - Ridge Regression
        - Clasificador de enfermedades
        - OpenRouter LLM integration
        - RAG con ChromaDB/Ollama
        - Model routing con fallback

      infrastructure:
        - Docker containerization
        - Render deployment
        - CI/CD pipelines
        - Scalable architecture

    multi_tenancy_design: |
      Cada finca es un tenant independiente.
      - Aislamiento lógico por farm_id
      - RLS asegura separación de datos
      - Usuarios pueden pertenencer a múltiples fincas
      - Transferencia de animales mantiene historial
      - Contexto compartido para predicciones cruzadas

    key_achievements:
      - Módulo de producción lechera completo
      - Predicción individual con 85%+ accuracy
      - Asistente que entiende contexto de finca
      - Sistema de ragas con recuperación de histórico
      - Plataforma escalable y mantenible
      - Documentación técnica completa

    learning_outcomes:
      - Full-stack arquitectura para dominio específico
      - Multi-tenancy y seguridad
      - ML aplicado a problema real
      - RAG en contexto agrícola
      - Conversación con contexto
      - Escalabilidad desde inicio

    future_evolution:
      - Aplicación móvil nativa
      - IoT y sensores en finca
      - Computer vision para salud animal
      - Genética y mejoramiento
      - Marketplace de servicios
      - API pública para integraciones
      - Análisis ambiental
      - Blockchain para trazabilidad

    significance: |
      Es donde la finca se convierte en sistema.
      Donde aprendí a conectar el campo real con la inteligencia digital.
      Donde todo lo anterior cobra sentido.

  - id: elite-beauty-agent
    name: Elite Beauty Agent
    tagline: Agente IA omnicanal para negocio de belleza
    type: Professional Project (RCKT)
    status: Production
    featured: true
    priority: 2

    overview: |
      Agente conversacional autónomo que opera en WhatsApp y voz,
      clasificando leads, conversando con contexto y actuando como
      secretaria, vendedora y soporte simultáneamente.

    channels:
      - WhatsApp (conversación)
      - Twilio Voice (llamadas)
      - Dashboard (administración)

    features:
      - Conversaciones contextuales
      - Clasificación de leads
      - Histórico de clientes
      - RAG con políticas de empresa
      - Recomendación de servicios
      - Disponibilidad 24/7
      - CRM integrado
      - Reportes y métricas

    technical_stack:
      - FastAPI backend
      - React/Vite frontend
      - Supabase pgvector RAG
      - OpenRouter + Anthropic LLMs
      - WhatsApp Cloud API
      - Twilio Voice API
      - asyncio + threading
      - WebSockets

    technical_challenges:
      - Event loop concurrency
      - Latencia en voz
      - Continuidad de contexto
      - Manejo de silencios
      - Sincronización WhatsApp-voz
      - Session management

    skills_applied:
      - LLM routing y fallback
      - Async Python
      - Multi-channel architecture
      - RAG con historial
      - Agent design
      - Real-time communication

  - id: intermuni-connect
    name: InterMuniConnect / CaliConnect
    tagline: Plataforma colombiana de carpooling intermunicipal
    type: Own Project / Product
    status: Active Development
    featured: true
    priority: 3

    overview: |
      Plataforma tipo Uber para viajes colaborativos entre municipios en Colombia.
      Conecta pasajeros y conductores, maneja reservas, pagos, rutas y ratings.

    concept: |
      Mongo decide. Supabase aprende. La IA explica y recomienda.
      El backend controla. El frontend muestra.

    technical_architecture:
      frontend:
        - Ionic + React + TypeScript
        - Capacitor (web y móvil)
        - Responsive design

      backend:
        - Node.js + Express + TypeScript
        - Prisma ORM
        - MongoDB (transacciones)
        - Supabase (analítica, RAG, vectores)

      features:
        - Registro dinámico por roles
        - Pasajero vs. Conductor
        - Verificación de identidad
        - Gestión de vehículos
        - Reservas y confirmaciones
        - QR para validación
        - Chat en tiempo real
        - Calificaciones y reseñas
        - Sistema de pagos

    intelligence_layer:
      - Recomendación de rutas
      - Predicción de demanda
      - Tarificación dinámica (pero determinista)
      - Análisis de patrones de viaje
      - Sugerencias de conductores ideales

    key_insight: |
      IA recomienda pero no inventa. Backend decide. Usuarios ven claridad.

