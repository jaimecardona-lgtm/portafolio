  - id: environmental-dimensions-ai
    title: The Environmental Dimensions of Artificial Intelligence- A Multifaceted Challenge
    authors:
      - Jaime Andrés Cardona Montero
      - Additional authors
    conference: IEEE CONCAPAN XLIII 2025
    location: San Salvador, El Salvador
    date: "2025"
    doi: "10.1109/CONCAPAN66820.2025.11512472"
    publication_year: 2025
    status: Published
    indexed: IEEE Xplore

    abstract: |
      Análisis multidimensional de los impactos ambientales de la inteligencia artificial,
      considerando consumo energético, emisiones de carbono, residuos electrónicos y
      sostenibilidad en sistemas de IA a escala.

    key_topics:
      - Environmental Impact
      - AI Sustainability
      - Carbon Footprint
      - Green AI
      - Responsible AI
      - Environmental Ethics

    connection_to_work: |
      Reflexión sobre sostenibilidad e impacto ambiental de la IA, relevante a la
      construcción responsable de sistemas inteligentes.

    link_doi: https://doi.org/10.1109/CONCAPAN66820.2025.11512472

