services:
  - type: web
    name: jaime-cardona-portfolio
    runtime: python
    plan: free
    buildCommand: |
      cd backend && pip install --only-binary :all: -r requirements.txt
      cd ../frontend && npm install && npm run build
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
    routes:
      - path: /api/*
        destination: /*
      - path: /*
        destination: /static/index.html
